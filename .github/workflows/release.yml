name: Release add-on image

# Build the add-on as a prebuilt multi-arch image and push it to GHCR, so Home
# Assistant Supervisor PULLS the image (no on-device build). Home Assistant wants
# one tag per architecture (e.g. `aarch64-…`, `amd64-…`), not a single multi-arch
# manifest, so each arch is built + pushed under its own arch-prefixed tag — which
# is exactly what addon/config.yaml's `image: ghcr.io/.../{arch}-…` resolves to.
#
# Fires on a version tag (e.g. `v1.0.0-rc1`, `v1.0.0`). Keep addon/config.yaml's
# `version:` equal to the tag (minus the leading `v`) so Supervisor pulls the
# image tag matching the installed add-on version.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Image version tag to build (e.g. 1.0.0-rc1)"
        required: true

# Least privilege at the workflow level; each job grants only the extra scope it
# needs (build-push -> packages: write for GHCR, e2e-report -> contents: write
# for the release asset).
permissions:
  contents: read

jobs:
  # Gate the image build on the version files matching the tag being released, so
  # a tag can never publish images whose in-app version (sidebar badge / health
  # endpoint) disagrees with the tag. The internal file-to-file consistency is
  # already enforced on every PR by ci.yml; this adds the tag comparison.
  verify-version:
    name: Verify version matches tag
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: meta
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            version="${{ github.event.inputs.version }}"
          else
            version="${GITHUB_REF_NAME#v}"
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Check the version files match the tag
        run: node scripts/check-version.mjs "${{ steps.meta.outputs.version }}"

  build-push:
    name: Build & push ${{ matrix.ha_arch }} image
    needs: verify-version
    runs-on: ubuntu-latest
    permissions:
      contents: read # checkout
      packages: write # push the arch image to GHCR
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            ha_arch: amd64
          - platform: linux/arm64
            ha_arch: aarch64
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version + lowercase owner
        id: meta
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            version="${{ github.event.inputs.version }}"
          else
            version="${GITHUB_REF_NAME#v}"
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      # Third-party actions are pinned to a full commit SHA (supply-chain
      # hardening) with the human-readable version in a trailing comment.
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push (${{ matrix.ha_arch }})
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: addon/Dockerfile
          platforms: ${{ matrix.platform }}
          push: true
          # No SLSA provenance/SBOM manifest — Supervisor pulls a plain image,
          # and the extra attestation manifest can trip up the add-on pull.
          provenance: false
          tags: |
            ghcr.io/${{ steps.meta.outputs.owner }}/${{ matrix.ha_arch }}-ha-finance-intelligence:${{ steps.meta.outputs.version }}
            ghcr.io/${{ steps.meta.outputs.owner }}/${{ matrix.ha_arch }}-ha-finance-intelligence:latest

  # Run the full Playwright UI suite against the release build and publish the
  # HTML report: always as a workflow artifact, and attached to the GitHub
  # Release for this tag when one exists (create the release, re-run this job or
  # upload manually if it was cut later).
  e2e-report:
    name: E2E report (release)
    runs-on: ubuntu-latest
    permissions:
      contents: write # upload the report as a release asset
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -f addon/Dockerfile -t ha-finance-intelligence:release .

      - name: Start + seed the app
        run: |
          set -e
          docker run -d --name hafi-release -p 8099:8099 ha-finance-intelligence:release
          ok=0
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8099/api/health | grep -q '"status":"ok"'; then ok=1; break; fi
            sleep 2
          done
          if [ "$ok" != "1" ]; then echo "::error::health check failed"; docker logs hafi-release; exit 1; fi
          curl -fsS http://127.0.0.1:8099/ >/dev/null
          curl -fsS -X POST http://127.0.0.1:8099/api/backup/demo >/dev/null

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: Install + run Playwright
        working-directory: e2e
        env:
          E2E_BASE_URL: http://127.0.0.1:8099
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npx playwright test

      - name: Zip the report
        if: always()
        run: |
          cd e2e && zip -qr ../playwright-report.zip playwright-report

      - name: Upload report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-release
          path: playwright-report.zip
          retention-days: 90

      - name: Attach report to the GitHub Release (if one exists for this tag)
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${GITHUB_REF_NAME}"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" playwright-report.zip --repo "$GITHUB_REPOSITORY" --clobber
            echo "report attached to release $tag"
          else
            echo "no GitHub Release for $tag yet - report kept as the workflow artifact"
          fi

      - name: Teardown
        if: always()
        run: docker rm -f hafi-release || true
