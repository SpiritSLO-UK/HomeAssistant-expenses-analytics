name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  backend:
    name: Backend (ruff + pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # Tesseract powers the optional image OCR (spec §21). On Linux all the
      # optional extras install, so CI exercises the at-rest encryption, MQTT,
      # OCR and PDF paths for real (unlike the Windows dev box).
      - name: Install Tesseract
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends tesseract-ocr

      - name: Install backend (all extras)
        run: pip install -e "./backend[dev,mqtt,encryption,ocr]"

      - name: Lint (ruff)
        working-directory: backend
        run: python -m ruff check .

      - name: Tests (pytest)
        working-directory: backend
        run: python -m pytest -q

  frontend:
    name: Frontend (type-check + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        working-directory: frontend
        run: npm ci

      - name: Build (tsc + vite)
        working-directory: frontend
        run: npm run build
