name: CI

on:
  # Only build main on push; feature branches are covered by their pull_request
  # run. This avoids the duplicate push+pull_request runs on every PR branch.
  # (SonarCloud runs via Automatic Analysis on its own servers, not in CI.)
  push:
    branches: [main]
  pull_request:

# One in-flight run per ref: a new push to a PR branch cancels the previous run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  backend:
    name: Backend (ruff + pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip

      # Tesseract powers the optional image OCR (spec §21). On Linux all the
      # optional extras install, so CI exercises the at-rest encryption, MQTT,
      # OCR and PDF paths for real (unlike the Windows dev box).
      - name: Install Tesseract
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends tesseract-ocr

      - name: Install backend (all extras)
        run: pip install -e "./backend[dev,mqtt,encryption,ocr]"

      - name: Lint (ruff)
        working-directory: backend
        run: python -m ruff check .

      - name: Tests (pytest)
        working-directory: backend
        run: python -m pytest -q

  frontend:
    name: Frontend (type-check + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        working-directory: frontend
        run: npm ci

      - name: Lint (eslint)
        working-directory: frontend
        run: npm run lint

      - name: Build (tsc + vite)
        working-directory: frontend
        run: npm run build

  docker:
    name: Docker image (build + smoke test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      # Build the runnable image (multi-stage: frontend build + backend runtime),
      # so the standalone `docker compose up` path is verified on every change.
      - name: Build image
        run: docker build -f addon/Dockerfile -t ha-finance-intelligence:ci .

      # Run the full pytest suite INSIDE the runtime image, so the shipped
      # environment (its Python, system libs like tesseract, and the wheels the
      # image installed) is exercised — not just the host job above. The tests +
      # dev deps aren't baked into the slim image (.dockerignore strips tests), so
      # mount the backend and install the test extras in-container before running.
      - name: Run the test suite inside the runtime image
        # The shipped image runs as a non-root user (CR-SEC-7), but this step
        # installs the dev/test extras into the image's root-owned site-packages,
        # so run it as root (-u 0). This only affects the in-CI test install; the
        # smoke test below still boots the image as its default non-root user.
        run: |
          docker run --rm \
            -u 0 \
            -v "${{ github.workspace }}:/work" \
            -w /work/backend \
            --entrypoint sh \
            ha-finance-intelligence:ci \
            -c "pip install --no-cache-dir '.[dev,mqtt,ocr,encryption]' && python -m pytest -q"

      # Boot the REAL artifact and exercise it over HTTP. Unit tests run the app
      # in-process and never catch image-level bugs (entrypoint line endings,
      # cwd/data-file resolution, frontend mounting, migrations). This black-box
      # check does — it's the automated form of the manual smoke test that caught
      # the run.sh CRLF + run-from-source bugs.
      - name: Smoke test the image
        run: |
          set -e
          docker run -d --name hafi-ci -p 8099:8099 ha-finance-intelligence:ci
          ok=0
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8099/api/health | grep -q '"status":"ok"'; then
              echo "health ok"; ok=1; break
            fi
            sleep 2
          done
          if [ "$ok" != "1" ]; then echo "::error::health check failed"; docker logs hafi-ci; exit 1; fi
          code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8099/)
          if [ "$code" != "200" ]; then echo "::error::frontend not served (HTTP $code)"; docker logs hafi-ci; exit 1; fi
          echo "frontend served (HTTP 200)"

      - name: Teardown
        if: always()
        run: docker rm -f hafi-ci || true

  encryption-restart:
    name: Encryption restart (no crash-loop)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      # Reproduces the release-blocking bug that a plaintext migration step in
      # run.sh caused: once at-rest encryption was enabled, the pre-app
      # `alembic upgrade head` built a keyless engine that could not open the
      # encrypted DB, so the container crash-looped on the NEXT restart. Migrations
      # now run in-process against the unlocked engine; this job proves an encrypted
      # container survives a restart and auto-unlocks from the saved .db_key file.
      - name: Build image
        run: docker build -f addon/Dockerfile -t ha-finance-intelligence:ci .

      # Named volume so /data (the DB + the .db_key auto-unlock file) survives the
      # restart. amd64 CI runners ship the `encryption` extra (sqlcipher3-binary).
      - name: Start the app
        run: docker run -d --name hafi-enc -v hafi-enc-data:/data -p 8099:8099 ha-finance-intelligence:ci

      - name: Wait for health
        run: |
          set -e
          ok=0
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8099/api/health | grep -q '"status":"ok"'; then
              echo "health ok"; ok=1; break
            fi
            sleep 2
          done
          if [ "$ok" != "1" ]; then echo "::error::health check failed"; docker logs hafi-enc; exit 1; fi

      # Bootstrap the local owner (GET /) then enable at-rest encryption in "stored"
      # mode, which saves the .db_key file so the app auto-unlocks unattended.
      - name: Enable at-rest encryption (stored mode)
        run: |
          set -e
          curl -fsS -X GET http://127.0.0.1:8099/ >/dev/null
          code=$(curl -s -o /tmp/enc.json -w '%{http_code}' -X POST http://127.0.0.1:8099/api/security/enable \
            -H 'Content-Type: application/json' -d '{"passphrase":"ci-pass","unlock_mode":"stored"}')
          echo "enable HTTP $code"; cat /tmp/enc.json || true
          if [ "$code" != "200" ]; then echo "::error::enable encryption failed"; docker logs hafi-enc; exit 1; fi

      # The moment that used to crash-loop: restart with NO env change. The app must
      # auto-unlock from the saved .db_key file and run migrations against the
      # UNLOCKED encrypted engine (previously the keyless engine could not open it).
      - name: Restart the container
        run: docker restart hafi-enc

      - name: Assert it comes back unlocked (not crash-looping)
        run: |
          set -e
          ok=0
          for i in $(seq 1 30); do
            status=$(curl -fsS http://127.0.0.1:8099/api/health || true)
            echo "health: $status"
            if echo "$status" | grep -q '"status":"ok"'; then ok=1; break; fi
            sleep 2
          done
          if [ "$ok" != "1" ]; then echo "::error::encrypted container did not come back unlocked"; docker logs hafi-enc; exit 1; fi
          code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8099/api/transactions)
          if [ "$code" != "200" ]; then echo "::error::data endpoint blocked after restart (HTTP $code)"; docker logs hafi-enc; exit 1; fi
          echo "encrypted restart OK: health unlocked + data served"

      - name: Teardown
        if: always()
        run: |
          docker rm -f hafi-enc || true
          docker volume rm hafi-enc-data || true

  root-owned-data:
    name: Root-owned /data (non-root container)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Build image
        run: docker build -f addon/Dockerfile -t ha-finance-intelligence:ci .

      # Home Assistant's Supervisor mounts /data root-owned, but the `docker` smoke
      # test runs with no volume so that path stays untested. Reproduce it here: a
      # named volume forced to root ownership. run.sh (backlog #372) must chown /data
      # to 10001 while it is still root, then re-exec itself unprivileged via gosu,
      # so the app can write a mount the Supervisor handed it as root.
      - name: Create a root-owned /data volume
        run: |
          set -e
          docker volume create hafi_rootvol
          docker run --rm -v hafi_rootvol:/data alpine chown -R 0:0 /data

      - name: Start the app on the root-owned volume
        run: docker run -d --name hafi-rootvol -p 8099:8099 -v hafi_rootvol:/data ha-finance-intelligence:ci

      - name: Wait for health
        run: |
          set -e
          ok=0
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8099/api/health | grep -q '"status":"ok"'; then
              echo "health ok"; ok=1; break
            fi
            sleep 2
          done
          if [ "$ok" != "1" ]; then echo "::error::health check failed on root-owned /data"; docker logs hafi-rootvol; exit 1; fi

      # Prove the APP process itself runs unprivileged. `docker top` reads the uid
      # from the host, so it reports the real uid of the running app process.
      # (`docker exec ... id` would only report the container's default user, not
      # this process, so it cannot catch a failed privilege drop.)
      - name: Assert the app runs as uid 10001 (not root)
        run: |
          set -e
          docker top hafi-rootvol -o uid,cmd
          uid=$(docker top hafi-rootvol -o uid,cmd | grep 'app.main' | awk '{print $1}' | head -n1)
          echo "app.main uid: ${uid:-<none>}"
          if [ -z "$uid" ]; then echo "::error::could not find the app.main process"; docker logs hafi-rootvol; exit 1; fi
          if [ "$uid" != "10001" ]; then echo "::error::app runs as uid $uid, expected 10001 (non-root)"; docker logs hafi-rootvol; exit 1; fi
          echo "app runs unprivileged (uid 10001)"

      # Prove /data self-healed: run.sh chowned the root-owned mount to 10001 so the
      # unprivileged app can actually write the DB there.
      - name: Assert /data self-healed to uid 10001
        run: |
          set -e
          owner=$(docker run --rm -v hafi_rootvol:/data alpine stat -c '%u' /data)
          echo "/data owner uid: $owner"
          if [ "$owner" != "10001" ]; then echo "::error::/data still owned by uid $owner, expected 10001"; exit 1; fi
          echo "/data self-healed to uid 10001"

      - name: Teardown
        if: always()
        run: |
          docker rm -f hafi-rootvol || true
          docker volume rm hafi_rootvol || true

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      # Build + boot the real shipped image (same artifact the docker job smoke
      # tests), so the e2e suite drives the standalone build end to end.
      - name: Build image
        run: docker build -f addon/Dockerfile -t ha-finance-intelligence:ci .

      - name: Start the app
        run: docker run -d --name hafi-e2e -p 8099:8099 ha-finance-intelligence:ci

      - name: Wait for health
        run: |
          set -e
          ok=0
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8099/api/health | grep -q '"status":"ok"'; then
              echo "health ok"; ok=1; break
            fi
            sleep 2
          done
          if [ "$ok" != "1" ]; then echo "::error::health check failed"; docker logs hafi-e2e; exit 1; fi

      # The image boots with an empty database; load the demo dataset so the
      # data-dependent specs (budgets, savings, transactions) have something to
      # assert against. Standalone runs as a local owner, so no auth is needed.
      - name: Seed demo data
        run: |
          set -e
          curl -fsS -X GET  http://127.0.0.1:8099/ >/dev/null   # bootstrap the local owner
          code=$(curl -s -o /tmp/seed.json -w '%{http_code}' -X POST http://127.0.0.1:8099/api/backup/demo)
          echo "seed HTTP $code"; cat /tmp/seed.json || true
          if [ "$code" != "200" ]; then echo "::error::demo seed failed"; docker logs hafi-e2e; exit 1; fi

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: Install e2e deps
        working-directory: e2e
        run: npm ci

      - name: Install Playwright browser
        working-directory: e2e
        run: npx playwright install --with-deps chromium

      - name: Run Playwright
        working-directory: e2e
        env:
          E2E_BASE_URL: http://127.0.0.1:8099
        run: npx playwright test

      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report
          retention-days: 14

      - name: Teardown
        if: always()
        run: docker rm -f hafi-e2e || true
