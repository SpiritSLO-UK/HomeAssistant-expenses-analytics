name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  backend:
    name: Backend (ruff + pytest)
    runs-on: ubuntu-latest
    env:
      # Hoisted to job level so the scan step's `if` can read it (a step can't
      # see env defined in its own block). Empty on fork PRs → scan is skipped.
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          # SonarCloud needs full history for accurate new-code / blame data.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # Tesseract powers the optional image OCR (spec §21). On Linux all the
      # optional extras install, so CI exercises the at-rest encryption, MQTT,
      # OCR and PDF paths for real (unlike the Windows dev box).
      - name: Install Tesseract
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends tesseract-ocr

      - name: Install backend (all extras)
        run: pip install -e "./backend[dev,mqtt,encryption,ocr]"

      - name: Lint (ruff)
        working-directory: backend
        run: python -m ruff check .

      - name: Tests (pytest + coverage)
        working-directory: backend
        run: python -m pytest -q --cov=app --cov-report=xml

      # SonarCloud analysis (Python + TypeScript). Reads sonar-project.properties.
      # Runs ONLY on pushes to main: the free SonarQube Cloud tier analyses the
      # main branch only (no PR/branch analysis). Fire-and-forget — continue-on-error
      # + a timeout mean a slow or transient scan never reddens main or blocks the
      # next change; results are read later from SonarCloud, not waited on here.
      - name: SonarCloud Scan
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && env.SONAR_TOKEN != '' }}
        continue-on-error: true
        timeout-minutes: 10
        env:
          SONAR_HOST_URL: https://sonarcloud.io
        uses: SonarSource/sonarqube-scan-action@v6

  frontend:
    name: Frontend (type-check + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        working-directory: frontend
        run: npm ci

      - name: Build (tsc + vite)
        working-directory: frontend
        run: npm run build

  docker:
    name: Docker image (standalone build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Build the runnable image (multi-stage: frontend build + backend runtime),
      # so the standalone `docker compose up` path is verified on every change.
      - name: Build image
        run: docker build -f addon/Dockerfile -t ha-finance-intelligence:ci .
