name: CI

on:
  # Only build main on push; feature branches are covered by their pull_request
  # run. This avoids the duplicate push+pull_request runs on every PR branch.
  # (SonarCloud runs via Automatic Analysis on its own servers, not in CI.)
  push:
    branches: [main]
  pull_request:

# One in-flight run per ref: a new push to a PR branch cancels the previous run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  backend:
    name: Backend (ruff + pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # Tesseract powers the optional image OCR (spec §21). On Linux all the
      # optional extras install, so CI exercises the at-rest encryption, MQTT,
      # OCR and PDF paths for real (unlike the Windows dev box).
      - name: Install Tesseract
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends tesseract-ocr

      - name: Install backend (all extras)
        run: pip install -e "./backend[dev,mqtt,encryption,ocr]"

      - name: Lint (ruff)
        working-directory: backend
        run: python -m ruff check .

      - name: Tests (pytest)
        working-directory: backend
        run: python -m pytest -q

  frontend:
    name: Frontend (type-check + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        working-directory: frontend
        run: npm ci

      - name: Lint (eslint)
        working-directory: frontend
        run: npm run lint

      - name: Build (tsc + vite)
        working-directory: frontend
        run: npm run build

  docker:
    name: Docker image (build + smoke test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Build the runnable image (multi-stage: frontend build + backend runtime),
      # so the standalone `docker compose up` path is verified on every change.
      - name: Build image
        run: docker build -f addon/Dockerfile -t ha-finance-intelligence:ci .

      # Run the full pytest suite INSIDE the runtime image, so the shipped
      # environment (its Python, system libs like tesseract, and the wheels the
      # image installed) is exercised — not just the host job above. The tests +
      # dev deps aren't baked into the slim image (.dockerignore strips tests), so
      # mount the backend and install the test extras in-container before running.
      - name: Run the test suite inside the runtime image
        run: |
          docker run --rm \
            -v "${{ github.workspace }}/backend:/work" \
            -w /work \
            --entrypoint sh \
            ha-finance-intelligence:ci \
            -c "pip install --no-cache-dir '.[dev,mqtt,ocr,encryption]' && python -m pytest -q"

      # Boot the REAL artifact and exercise it over HTTP. Unit tests run the app
      # in-process and never catch image-level bugs (entrypoint line endings,
      # cwd/data-file resolution, frontend mounting, migrations). This black-box
      # check does — it's the automated form of the manual smoke test that caught
      # the run.sh CRLF + run-from-source bugs.
      - name: Smoke test the image
        run: |
          set -e
          docker run -d --name hafi-ci -p 8099:8099 ha-finance-intelligence:ci
          ok=0
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8099/api/health | grep -q '"status":"ok"'; then
              echo "health ok"; ok=1; break
            fi
            sleep 2
          done
          if [ "$ok" != "1" ]; then echo "::error::health check failed"; docker logs hafi-ci; exit 1; fi
          code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8099/)
          if [ "$code" != "200" ]; then echo "::error::frontend not served (HTTP $code)"; docker logs hafi-ci; exit 1; fi
          echo "frontend served (HTTP 200)"

      - name: Teardown
        if: always()
        run: docker rm -f hafi-ci || true
