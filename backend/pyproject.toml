[project]
name = "ha-finance-intelligence"
version = "0.1.0"
description = "Local-first, Home Assistant-first personal finance app"
requires-python = ">=3.12"
authors = [{ name = "Blaz Peternel" }]
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0.35",
    "alembic>=1.14",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "python-multipart>=0.0.12",
    "httpx>=0.28",
    "cryptography>=43.0",
]

[project.urls]
Homepage = "https://github.com/SpiritSLO-UK/HomeAssistant-expenses-analytics"
Repository = "https://github.com/SpiritSLO-UK/HomeAssistant-expenses-analytics"

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "httpx>=0.28",
    "ruff>=0.8",
]
mqtt = [
    "paho-mqtt>=2.1",
]
# Local receipt OCR (spec §21). Optional: image OCR also needs the `tesseract`
# binary (installed in the add-on image, usually absent on Windows). pypdf
# extracts text from digital PDFs with no binary.
ocr = [
    "pytesseract>=0.3.13",
    "Pillow>=11.0",
    "pypdf>=5.1",
    # Rasterise scanned/image-only PDF pages so Tesseract can OCR them. Self-
    # contained wheel (bundles PDFium, no system poppler needed); image OCR still
    # needs the tesseract binary. Falls back gracefully if absent.
    "pypdfium2>=4.0",
]
# At-rest DB encryption (backlog #15b). Kept optional: sqlcipher3-binary has no
# Windows wheel, so it must not be a core dependency. Installed in the add-on
# image (Linux) and in CI/Linux dev.
encryption = [
    "sqlcipher3-binary>=0.5",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# UP042 (StrEnum) would change enum identity semantics; keep (str, Enum).
ignore = ["UP042"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI dependency injectors are meant to be called in defaults (not B008).
extend-immutable-calls = [
    "fastapi.Depends", "fastapi.Query", "fastapi.File", "fastapi.Form",
    "fastapi.Body", "fastapi.Path", "fastapi.Header",
]

[tool.ruff.lint.per-file-ignores]
# Tests favour readable one-line asserts over the 100-col limit.
"app/tests/*" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["app/tests"]
