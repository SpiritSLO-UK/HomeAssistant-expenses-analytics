[project]
name = "ha-finance-intelligence"
# Single source of truth: app.__version__ (kept in lockstep with addon/config.yaml
# + the published image tag at release). Avoids the packaging version drifting
# from the shipped app version (CR-BUG-4).
dynamic = ["version"]
description = "Local-first, Home Assistant-first personal finance app"
requires-python = ">=3.12"
authors = [{ name = "Blaz Peternel" }]
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0.35",
    "alembic>=1.14",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "python-multipart>=0.0.12",
    "httpx>=0.28",
    "cryptography>=43.0",
]

[project.urls]
Homepage = "https://github.com/SpiritSLO-UK/HomeAssistant-expenses-analytics"
Repository = "https://github.com/SpiritSLO-UK/HomeAssistant-expenses-analytics"

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    # Run the suite across all CPU cores (`-n auto`, set in addopts below). Tests
    # are isolated by construction — each worker is its own process and gets its
    # own temp database dir from conftest's mkdtemp — so parallelism is safe.
    "pytest-xdist>=3.6",
    "httpx>=0.28",
    "ruff>=0.8",
]
mqtt = [
    "paho-mqtt>=2.1",
]
# Local receipt OCR (spec §21). Optional: image OCR also needs the `tesseract`
# binary (installed in the add-on image, usually absent on Windows). pypdf
# extracts text from digital PDFs with no binary.
ocr = [
    "pytesseract>=0.3.13",
    "Pillow>=11.0",
    "pypdf>=5.1",
    # Rasterise scanned/image-only PDF pages so Tesseract can OCR them. Self-
    # contained wheel (bundles PDFium, no system poppler needed); image OCR still
    # needs the tesseract binary. Falls back gracefully if absent.
    "pypdfium2>=4.0",
]
# At-rest DB encryption (backlog #15b). Kept optional: sqlcipher3-binary has no
# Windows wheel, so it must not be a core dependency. Installed in the add-on
# image (Linux) and in CI/Linux dev.
encryption = [
    "sqlcipher3-binary>=0.5",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.dynamic]
version = { attr = "app.__version__" }

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# UP042 (StrEnum) would change enum identity semantics; keep (str, Enum).
ignore = ["UP042"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI dependency injectors are meant to be called in defaults (not B008).
extend-immutable-calls = [
    "fastapi.Depends", "fastapi.Query", "fastapi.File", "fastapi.Form",
    "fastapi.Body", "fastapi.Path", "fastapi.Header",
]

[tool.ruff.lint.per-file-ignores]
# Tests favour readable one-line asserts over the 100-col limit.
"app/tests/*" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["app/tests"]
# Spread tests across all CPU cores (pytest-xdist). Each worker is a separate
# process with its own isolated temp DB (conftest mkdtemp), so this is safe and
# cuts the wall-clock time of the suite by roughly the core count. Override with
# `-n0` to run serially (e.g. when stepping through a single test in a debugger).
addopts = "-n auto"

[tool.pyright]
# Baseline type-checking config so the IDE (Pylance) and any future CI agree.
# Basic mode catches real None-safety / argument-type bugs without the heavy
# false-positive load of strict mode. Pylance uses the interpreter you select in
# the editor; CLI runs pass --pythonpath.
include = ["app"]
# Tests are dev-only (stripped from the trimmed HA build) and lean on fixtures
# whose values are non-None by construction; strict typing there adds asserts for
# no runtime benefit. Type-check shipped code strictly, tests loosely.
ignore = ["app/tests"]
pythonVersion = "3.12"
typeCheckingMode = "basic"
