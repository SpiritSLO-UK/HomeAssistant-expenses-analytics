sonar.projectKey=SpiritSLO-UK_HomeAssistant-expenses-analytics
sonar.organization=spiritslo-uk

# Main source vs test code. Keeping tests classified as tests means test-only
# patterns (fixtures, sample data) aren't judged as production code.
sonar.sources=backend/app,frontend/src
sonar.tests=backend/app/tests

# Generated / vendored / non-source paths. The test dir is excluded from MAIN
# sources (it's declared under sonar.tests below) so the two sets stay disjoint
# — otherwise the scanner errors with "can't be indexed twice".
sonar.exclusions=backend/app/tests/**,backend/app/migrations/**,frontend/dist/**,**/__pycache__/**

sonar.python.version=3.12
# Coverage produced by the backend CI job (pytest --cov ... --cov-report=xml).
sonar.python.coverage.reportPaths=backend/coverage.xml

# --- Justified false-positive suppressions (kept in VCS, reviewable) ---
# Every entry below was verified by hand; see PR "CI-based SonarCloud analysis".
sonar.issue.ignore.multicriteria=e1,e2,e3,e4

# S2068 "hard-coded credential": the only matches are test passphrases/fixtures
# in the encryption tests, not real secrets.
sonar.issue.ignore.multicriteria.e1.ruleKey=python:S2068
sonar.issue.ignore.multicriteria.e1.resourceKey=backend/app/tests/**

# S5332 "use https": the http:// URLs are offline test doubles for Paperless.
sonar.issue.ignore.multicriteria.e2.ruleKey=python:S5332
sonar.issue.ignore.multicriteria.e2.resourceKey=backend/app/tests/**

# S2083 "path from user-controlled data": _write_events writes to a fixed
# internal path (_events_path()), not user input.
sonar.issue.ignore.multicriteria.e3.ruleKey=pythonsecurity:S2083
sonar.issue.ignore.multicriteria.e3.resourceKey=backend/app/services/security_service.py

# S2083: backup restore writes the uploaded bytes to a tempfile.mkstemp() path,
# which is system-generated, not user-controlled.
sonar.issue.ignore.multicriteria.e4.ruleKey=pythonsecurity:S2083
sonar.issue.ignore.multicriteria.e4.resourceKey=backend/app/services/backup_service.py
