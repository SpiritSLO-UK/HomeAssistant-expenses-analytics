# SonarCloud Automatic Analysis configuration (honoured by autoscan).
# Exclude generated / vendored code from analysis: Alembic migrations are
# auto-generated and frozen once shipped, so style findings there are noise we
# shouldn't hand-edit.
sonar.exclusions=backend/app/db/migrations/**,frontend/dist/**

# Pin the Python version so the analyzer stops assuming "all Python 3 versions"
# (which raises an analysis warning) and can apply version-accurate rules.
# Matches backend/pyproject.toml `requires-python = ">=3.12"` and the CI runner.
sonar.python.version=3.12

# Mark the test tree as test code (not main sources) so test-only patterns are
# judged by test rules.
sonar.tests=backend/app/tests
sonar.test.inclusions=backend/app/tests/**

# Test fixtures legitimately contain dummy passphrases/passwords (e.g.
# {"passphrase": "x"} in API tests). python:S2068 "hard-coded credential" is a
# false positive there — it kept failing the branch quality gate's new-code
# security rating. Ignore that rule inside the test tree only; real source is
# still scanned.
sonar.issue.ignore.multicriteria=t1
sonar.issue.ignore.multicriteria.t1.ruleKey=python:S2068
sonar.issue.ignore.multicriteria.t1.resourceKey=backend/app/tests/**
