# Home Assistant add-on configuration (spec §26.1).
name: HA Finance Intelligence
version: "0.1.0"
slug: ha_finance_intelligence
description: Local-first personal finance app for Home Assistant
url: https://github.com/your-org/ha-finance-intelligence
arch:
  - aarch64
  - amd64
startup: services
boot: auto
ingress: true
ingress_port: 8099
panel_icon: mdi:cash-multiple
panel_title: Finance
init: false
map:
  - addon_config:rw
  - homeassistant_config:rw
options:
  database_path: /config/finance/finance.db
  currency: GBP
  privacy_mode: strict_local
  mqtt_enabled: false
  log_level: INFO
schema:
  database_path: str
  currency: str
  privacy_mode: list(strict_local|local_llm|cloud_manual|cloud_auto|no_ai)
  mqtt_enabled: bool
  log_level: list(DEBUG|INFO|WARNING|ERROR)
