# Home Assistant add-on configuration (spec §26.1).
name: HA Finance Intelligence
version: "1.0.0-rc3"
slug: ha_finance_intelligence
description: Local-first personal finance app for Home Assistant
url: https://github.com/SpiritSLO-UK/HomeAssistant-expenses-analytics
# Prebuilt multi-arch image on GHCR. Supervisor substitutes {arch} (aarch64 /
# amd64) and pulls `<image>:<version>`, so Home Assistant never builds on-device
# — install is a quick image pull. The release workflow publishes these tags;
# keep `version` above in lockstep with the published image tag.
image: "ghcr.io/spiritslo-uk/{arch}-ha-finance-intelligence"
arch:
  - aarch64
  - amd64
startup: services
boot: auto
ingress: true
ingress_port: 8099
panel_icon: mdi:cash-multiple
panel_title: Finance
# We build on plain python:3.12-slim (no s6-overlay), so let Docker's init (tini)
# be PID 1 for proper signal forwarding + zombie reaping; it then runs run.sh.
init: true
# --- Isolation hardening (backlog #5, #26, #27; see docs/security.md) ---
# No shared folder mappings: finance data lives in the add-on's PRIVATE /data
# volume, so no other add-on or the Home Assistant /config share can read it.
# /data is persistent and included in Home Assistant backups.
host_network: false
hassio_api: false
# Read-only access to the Home Assistant Core API — used ONLY by the optional
# energy-cost offset when its source is "ha_api", to read the specific energy
# entities the user names (never writes, never enumerates). The Supervisor injects
# SUPERVISOR_TOKEN; ha_service is the only caller. Off-feature, this is unused.
homeassistant_api: true
auth_api: false
# To enable the bundled AppArmor profile, copy apparmor.txt.example to
# apparmor.txt (see docs/security.md) — shipped as an example so an untested
# profile can't prevent the add-on from starting.
# Auto-discover the MQTT broker (the Mosquitto add-on) from the Supervisor so the
# user doesn't have to type host/credentials — run.sh reads /services/mqtt when
# MQTT is enabled and no username is set manually. "want" = optional: the add-on
# still starts if no MQTT service is installed. This grants only the MQTT service
# config; it does not widen access to your wider Home Assistant config.
services:
  - mqtt:want
options:
  database_path: /data/finance/finance.db
  currency: GBP
  privacy_mode: strict_local
  mqtt_enabled: false
  mqtt_host: core-mosquitto
  mqtt_port: 1883
  mqtt_username: ""
  mqtt_password: ""
  log_level: INFO
schema:
  database_path: str
  currency: str
  privacy_mode: list(strict_local|local_llm|cloud_manual|cloud_auto|no_ai)
  # MQTT publishing (spec §27). Off by default; point at your broker (the
  # Mosquitto add-on is "core-mosquitto"). Credentials are optional.
  mqtt_enabled: bool
  mqtt_host: str?
  mqtt_port: int(1024,65535)?
  mqtt_username: str?
  mqtt_password: password?
  log_level: list(DEBUG|INFO|WARNING|ERROR)
